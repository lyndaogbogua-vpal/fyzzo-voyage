# Pages CMS settings: https://app.pagescms.org
# Lets the Fyzzo team write and edit blog articles without touching code.

media:
  input: assets/blog
  output: /fyzzo-voyage/assets/blog
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: articles
    label: Blog articles
    type: collection
    path: _articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The headline. The web address is made from this when you first save."
      - name: description
        label: Short summary
        type: text
        required: true
        description: "1–2 sentences. Shown under the title, on blog cards, on the homepage and in Google results."
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Study Abroad
            - Visa Support
            - Travel
            - Relocation
            - Proof of Funds
            - News & Updates
            - Client Stories
            - Tips
      - name: image
        label: Cover photo
        type: image
        description: "Landscape photo, at least 1600 px wide. Never upload client documents or anything showing personal details."
      - name: image_alt
        label: Photo description
        type: string
        description: "Describe the photo in a few words, for people using screen readers and for Google."
      - name: cta
        label: Call to action at the end
        type: select
        required: true
        description: "Which Fyzzo service box appears under the article."
        options:
          values:
            - { name: study, label: "Study Abroad Guidance" }
            - { name: funds, label: "Proof of Funds Review" }
            - { name: visa, label: "Visit / Family Visa Support" }
            - { name: refusal, label: "Visa Refusal Review" }
            - { name: arrival, label: "Arrival & Relocation Support" }
            - { name: travel, label: "Flights & Accommodation" }
      - name: published
        label: Published (untick to keep as a draft)
        type: boolean
        default: true
      - name: disclaimer
        label: Disclaimer (optional)
        type: text
        description: "Leave empty to use the standard 'general guidance, not legal advice' note."
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown

  - name: services
    label: Service pages
    type: collection
    path: _services
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, price, order]
      sort: order
      order: asc
    fields:
      - { name: title, label: Service name, type: string, required: true, description: "The web address is made from this when you first save. Don't rename the file of an existing service, or links on the homepage will break." }
      - { name: short, label: "Short name (used in 'Ready to talk about ...?')", type: string }
      - { name: kicker, label: Small label above the title, type: string }
      - { name: icon, label: Emoji icon, type: string }
      - { name: order, label: Position on the services page (1 = first), type: number }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: image, label: Top photo, type: image }
      - { name: image_alt, label: Photo description, type: string }
      - { name: price, label: "Price (e.g. ₦350,000, or 'Tailored to your trip')", type: string }
      - { name: price_note, label: Note under the price, type: text }
      - { name: form_service, label: "Contact form service (must match a 'Service Required' option exactly)", type: string }
      - { name: included, label: "What's included", type: string, list: true }
      - name: modules
        label: Modules with their own price (optional)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: text, label: Description, type: text }
          - { name: price, label: Price, type: string }
      - name: topics
        label: "Learn-more sections (each homepage card links to one by its ID)"
        type: object
        list: true
        fields:
          - { name: id, label: "ID (lowercase-with-dashes; don't change it, homepage links use it)", type: string }
          - { name: icon, label: Emoji, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Explanation, type: text }
          - { name: points, label: Key points, type: string, list: true }
          - { name: tip, label: "Good to know (optional)", type: text }
      - { name: excluded, label: Not included, type: text }
      - name: faqs
        label: Common questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: body, label: Main text, type: rich-text, options: { format: markdown } }
